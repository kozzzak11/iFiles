name: Android APK
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      # The signing key lives only in the DEBUG_KEYSTORE_BASE64 repository secret.
      # Secrets are not passed to pull requests from forks: those builds get a throwaway key and are never published.
      - name: Signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          umask 077
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > ~/.android/debug.keystore
            echo "REAL_SIGNING_KEY=true" >> "$GITHUB_ENV"
          else
            echo "::warning::DEBUG_KEYSTORE_BASE64 is not available; using a throwaway key (APK will not be published)."
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -keypass android -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi
      - run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleRelease :app:assembleDebugAndroidTest --stacktrace
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native PDF and image preview on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            gradle :app:connectedDebugAndroidTest --stacktrace; status=$?; mkdir -p app/build/reports/preview-screenshots; adb pull /sdcard/Android/data/com.serhii.ifiles/files/preview-screenshots app/build/reports/preview-screenshots || true; exit $status
      - name: Remove signing key from runner
        if: always()
        run: rm -f ~/.android/debug.keystore
      - uses: actions/upload-artifact@v4
        with:
          name: iFiles-install-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            app/build/reports/
          retention-days: 3

      - name: Publish direct APK download
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$LATEST" != "$GITHUB_SHA" ]; then
            echo "A newer commit exists; skipping publication."
            exit 0
          fi
          if [ "$REAL_SIGNING_KEY" != "true" ]; then
            echo "::error::Not signed with the personal key; refusing to publish."
            exit 1
          fi
          # Updates must install over existing installs: the certificate has to match the original key.
          EXPECTED=7822930a6ddca6cce710bada97ca6a421697213f2cf4903a040c2626797a7abe
          ACTUAL=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Unexpected signing certificate $ACTUAL"
            exit 1
          fi
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          test -n "$VERSION"
          cp app/build/outputs/apk/release/app-release.apk iFiles.apk
          if ! gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "iFiles $VERSION" --notes "Android APK. Compilation, unit tests and Android Lint passed in GitHub Actions."
          fi
          gh release upload "v$VERSION" iFiles.apk --repo "$GITHUB_REPOSITORY" --clobber
